name: IPv6 Script Regression

on:
  push:
    paths:
      - '**/*.sh'
      - 'scripts/validate_image_archive.py'
      - 'tests/test_image_archive.py'
      - '.github/workflows/containerd_build.yml'
      - '.github/workflows/ipv6-regression.yml'
  pull_request:
    paths:
      - '**/*.sh'
      - 'scripts/validate_image_archive.py'
      - 'tests/test_image_archive.py'
      - '.github/workflows/containerd_build.yml'
      - '.github/workflows/ipv6-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ipv6-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' shell_files < <(
            find . -path './.git' -prune -o -type f -name '*.sh' -print0 | sort -z
          )
          ((${#shell_files[@]} > 0)) || exit 0
          for file in "${shell_files[@]}"; do
            bash -n "$file"
          done
          shellcheck -S error -- "${shell_files[@]}"

      - name: Run IPv6 regression tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_ipv6_network.sh
          python3 tests/test_image_archive.py
          bash tests/test_creation_rollback.sh
          bash tests/test_batch_creation_rollback.sh

  script-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Run installer smoke tests across supported base systems
        shell: bash
        run: |
          set -euo pipefail
          images=(ubuntu:22.04 debian:12 alpine:3.20)
          run_smoke() {
            local image="$1"
            docker run --rm -v "$PWD:/repo:ro" -w /repo "$image" sh -c '
              set -eu
              if command -v apk >/dev/null 2>&1; then
                apk add --no-cache bash curl coreutils python3 >/dev/null
              else
                export DEBIAN_FRONTEND=noninteractive
                apt-get update >/dev/null
                apt-get install -y --no-install-recommends bash curl ca-certificates python3 >/dev/null
              fi
              tmp_repo=$(mktemp -d)
              cp -a /repo/. "$tmp_repo/"
              cd "$tmp_repo"
              bash tests/script_smoke.sh
            '
          }
          for image in "${images[@]}"; do
            if smoke_output=$(run_smoke "$image" 2>&1); then
              printf '%s\n' "$smoke_output"
              continue
            fi
            printf '%s\n' "$smoke_output"
            annotation=$(printf '%s' "$smoke_output" | tail -n 80 | tr '\r\n' ' ' | cut -c1-7000 | sed 's/%/%25/g')
            printf '::error title=Containerd smoke failed for %s::%s\n' "$image" "$annotation"
            exit 1
          done
